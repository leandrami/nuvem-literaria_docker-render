# declara que ${PORT} é preenchido com a porta do Render ao iniciar.

server {
    # escuta na porta que o Render mandar
    listen ${PORT};

    # declara a pasta onde estão os arquivos do React (copiados no Dockerfile).
    root /usr/share/nginx/html;
    index index.html;

    # o arquivo de configuração NÃO pode ficar em cache, senão uma mudança de URL da API não aparece.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    # --- ROTEAMENTO DO REACT --- 
    # o React Router controla as rotas no navegador. Se alguém abrir /livros/10 direto, o Nginx não acharia esse arquivo -> erro 404.
    # try_files: tenta o arquivo; se não existir, devolve index.html e o React decide qual tela mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}